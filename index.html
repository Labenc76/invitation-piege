<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitation Spéciale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .btn-yes-anim { transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(51, 65, 85, 0.8); border-radius: 9999px; }
  </style>
</head>
<body class="h-full flex items-center justify-center p-4 relative overflow-hidden bg-slate-950">

  <!-- Halo lumineux décoratif -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- CARTE DE LA BLAGUE -->
  <div class="bg-slate-900/90 border border-slate-800 shadow-2xl rounded-3xl p-8 max-w-md w-full text-center relative z-10 backdrop-blur-xl">
    
    <!-- ÉTAPE 1 : INVITATION -->
    <div id="stepInvite" class="space-y-6">
      <div>
        <span class="bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-semibold text-xs px-3 py-1 rounded-full uppercase tracking-wider">Invitation</span>
        <h2 id="viewTitle" class="text-2xl font-bold text-white mt-4 leading-snug">Chargement...</h2>
        <p id="viewSubtitle" class="text-slate-400 text-sm mt-2"></p>
      </div>

      <div id="buttonsArea" class="relative h-24 w-full flex items-center justify-center gap-6 mt-6">
        <button id="btnYes" class="btn-yes-anim absolute px-6 py-3 bg-indigo-600 text-white font-semibold rounded-2xl shadow-lg shadow-indigo-600/30 cursor-pointer select-none text-sm z-20">
          OUI 🚀
        </button>
        <button id="btnNo" onclick="triggerTrap()" class="absolute px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-2xl shadow-lg shadow-rose-600/30 cursor-pointer text-sm z-10 transition-all active:scale-95">
          NON ❌
        </button>
      </div>
    </div>

    <!-- ÉTAPE 2 : QUESTIONNAIRE MAGIQUE -->
    <div id="stepQuiz" class="hidden text-left space-y-5">
      <div class="text-center pb-2 border-b border-slate-800">
        <span class="bg-rose-500/10 text-rose-400 border border-rose-500/20 font-semibold text-xs px-3 py-1 rounded-full uppercase tracking-wider">Piège Activé</span>
        <p class="text-xs text-slate-400 mt-2">Appuie sur n'importe quelle touche de ton clavier pour répondre...</p>
      </div>

      <div class="space-y-4">
        <div class="flex items-center justify-between text-xs text-slate-400 font-medium">
          <span id="qProgress">Question 1/1</span>
          <span class="text-indigo-400">Simulation active</span>
        </div>

        <h3 id="currentQuestionText" class="text-base font-bold text-white">--</h3>

        <div class="relative">
          <textarea id="fakeTextarea" readonly class="w-full h-32 bg-slate-950 border border-slate-800 rounded-2xl p-3.5 text-slate-200 text-sm focus:outline-none resize-none shadow-inner custom-scrollbar" placeholder="Commence à taper sur ton clavier..."></textarea>
          <div id="typingIndicator" class="hidden absolute bottom-3 right-3 flex items-center gap-1 bg-indigo-950/80 border border-indigo-800 px-2 py-1 rounded-md text-[10px] text-indigo-300">
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-400 animate-ping"></span>
            <span>Saisie magique...</span>
          </div>
        </div>
      </div>

      <button id="btnNextQuestion" onclick="nextQuestion()" class="hidden w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-2xl text-sm transition-all shadow-lg shadow-emerald-600/20 cursor-pointer text-center">
        Question suivante ➔
      </button>
    </div>

    <!-- ÉTAPE 3 : CONCLUSION -->
    <div id="stepFinish" class="hidden text-center space-y-4 py-4">
      <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 rounded-full flex items-center justify-center text-emerald-400 text-3xl mx-auto">
        🎉
      </div>
      <h3 class="text-xl font-bold text-white">Merci pour tes réponses !</h3>
      <p class="text-sm text-slate-400">Tout a été enregistré avec succès (et tu as dit oui à tout) ! 😉</p>
    </div>

  </div>

  <script>
    let prankData = {
      title: "Viens-tu à ma soirée vendredi prochain ? 🍕",
      subtitle: "Sois franc(he), ta réponse est très importante pour l'organisation !",
      questions: [
        { q: "Pourquoi as-tu fini par cliquer sur NON ?", a: "Parce que le bouton OUI s'enfuyait tout le temps ! Mais au fond, c'est évident que je viens !" },
        { q: "Qu'est-ce que tu amènes à boire et à manger ?", a: "Pizzas pour tout le monde et mes meilleures boissons, c'est offert par la maison !" }
      ]
    };

    let dodgeCount = 0;
    const maxDodges = 3;
    let yesX = -60, yesY = 0;
    let currentQIndex = 0, charIndex = 0;

    window.addEventListener('DOMContentLoaded', () => {
      // Charger la configuration depuis l'URL si elle existe
      const urlParams = new URLSearchParams(window.location.search);
      const dataParam = urlParams.get('data');
      if (dataParam) {
        try {
          const decoded = decodeURIComponent(escape(atob(dataParam)));
          const parsed = JSON.parse(decoded);
          if (parsed && parsed.title && parsed.questions) {
            prankData = parsed;
          }
        } catch (e) {
          console.error("Erreur de décodage", e);
        }
      }

      document.getElementById('viewTitle').textContent = prankData.title;
      document.getElementById('viewSubtitle').textContent = prankData.subtitle;

      setupDodgeEvents();
    });

    function setupDodgeEvents() {
      const btnYes = document.getElementById('btnYes');
      const handleDodge = (e) => {
        if (dodgeCount >= maxDodges) return;
        if (e) e.preventDefault();
        dodgeCount++;
        yesX = yesX <= 0 ? 70 : -70;
        yesY = yesY === 0 ? (Math.random() > 0.5 ? 25 : -25) : -yesY;
        btnYes.style.transform = `translate(${yesX}px, ${yesY}px)`;

        if (dodgeCount >= maxDodges) {
          btnYes.style.opacity = '0';
          btnYes.style.pointerEvents = 'none';
          document.getElementById('btnNo').style.transform = 'translateX(0px)';
        }
      };

      btnYes.addEventListener('mouseenter', handleDodge);
      btnYes.addEventListener('touchstart', handleDodge, { passive: false });
      btnYes.addEventListener('click', handleDodge);
    }

    function triggerTrap() {
      document.getElementById('stepInvite').classList.add('hidden');
      document.getElementById('stepQuiz').classList.remove('hidden');
      currentQIndex = 0;
      charIndex = 0;
      loadCurrentQuestion();
    }

    function loadCurrentQuestion() {
      if (currentQIndex >= prankData.questions.length) {
        document.getElementById('stepQuiz').classList.add('hidden');
        document.getElementById('stepFinish').classList.remove('hidden');
        return;
      }
      const qItem = prankData.questions[currentQIndex];
      document.getElementById('qProgress').textContent = `Question ${currentQIndex + 1}/${prankData.questions.length}`;
      document.getElementById('currentQuestionText').textContent = qItem.q;
      document.getElementById('fakeTextarea').value = '';
      charIndex = 0;
      document.getElementById('btnNextQuestion').classList.add('hidden');
    }

    window.addEventListener('keydown', (e) => {
      const stepQuiz = document.getElementById('stepQuiz');
      if (stepQuiz.classList.contains('hidden')) return;
      if (['Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'Tab'].includes(e.key)) return;
      if (["Space", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();

      const qItem = prankData.questions[currentQIndex];
      if (!qItem) return;

      const targetText = qItem.a || "";
      const textarea = document.getElementById('fakeTextarea');
      const indicator = document.getElementById('typingIndicator');

      if (charIndex < targetText.length) {
        indicator.classList.remove('hidden');
        textarea.value += targetText[charIndex];
        charIndex++;
        textarea.scrollTop = textarea.scrollHeight;

        if (charIndex >= targetText.length) {
          indicator.classList.add('hidden');
          document.getElementById('btnNextQuestion').classList.remove('hidden');
        }
      }
    });

    function nextQuestion() {
      currentQIndex++;
      loadCurrentQuestion();
    }
  </script>
</body>
</html>
